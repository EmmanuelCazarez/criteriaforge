name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate pull request title and source branch
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          .github/scripts/validate-pr-policy.sh
          "${PR_TITLE}"
          "${HEAD_REF}"
          "${HEAD_REPOSITORY}"
          "${BASE_REPOSITORY}"
          "${BASE_REF}"
          "${BASE_SHA}"
      - name: Set up Java 17 for release metadata validation
        if: >-
          github.base_ref == 'main' &&
          github.event.pull_request.title != 'ci: adopt release-only main governance'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate release pull request metadata
        if: >-
          github.base_ref == 'main' &&
          github.event.pull_request.title != 'ci: adopt release-only main governance'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          project_version="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          .github/scripts/validate-release-pr.sh "${PR_TITLE}" "${project_version}" CHANGELOG.md

  build-java17-boot3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify -Dspring-boot.version=3.5.16

  build-java17-boot4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify -Dspring-boot.version=4.1.0

  postgresql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp -Ppostgresql-tests verify

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp -Pquality verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
