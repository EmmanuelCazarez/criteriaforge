name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing signed release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_SIGNING_FINGERPRINT: 27CE82768E118D3F80256BB6E60E5A6A6709E150

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          path: trusted-tools
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Fetch main without rewriting tags
        run: git -C candidate fetch --no-tags origin main:refs/remotes/origin/main
      - name: Validate signed release candidate
        id: validate
        run: |
          cd candidate
          ../trusted-tools/.github/scripts/validate-release-candidate.sh \
            "${RELEASE_TAG}" \
            "${RELEASE_SIGNING_FINGERPRINT}" \
            ../trusted-tools/.github/release-signing-key.asc \
            >> "${GITHUB_OUTPUT}"

  build-java17-boot3:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp clean verify -Dspring-boot.version=3.5.16

  build-java17-boot4:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp clean verify -Dspring-boot.version=4.1.0

  postgresql:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp -Ppostgresql-tests verify

  quality:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp -Pquality,documentation verify

  publish:
    needs:
      - candidate
      - build-java17-boot3
      - build-java17-boot4
      - postgresql
      - quality
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Import signing key into an ephemeral keyring
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          signing_home="$(mktemp -d)"
          chmod 700 "${signing_home}"
          echo "GNUPGHOME=${signing_home}" >> "${GITHUB_ENV}"
          printf '%s' "${GPG_PRIVATE_KEY}" | base64 --decode |
            GNUPGHOME="${signing_home}" gpg --batch --import
      - name: Upload signed bundle for manual Central publication
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          ./mvnw -B -ntp -Prelease -DskipTests
          -DexcludeArtifacts=criteriaforge-example
          deploy
      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [[ -n "${GNUPGHOME:-}" && "${GNUPGHOME}" == /tmp/* ]]; then
            gpgconf --kill all || true
            rm -rf "${GNUPGHOME}"
          fi
